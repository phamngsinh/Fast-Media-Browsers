[package]
name = "fast_media_browser_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27.2"
egui = "0.27.2"
egui_extras = "0.27.2"
image = "0.25.1"
walkdir = "2.5.0"
fs_extra = "1.3.0"
trash = "3.2.1"
chrono = "0.4.38"
crossbeam-channel = "0.5.12"
rayon = "1.10.0"
num-format = "0.4.4"
sysinfo = "0.38.4"
file_icon_provider = "1.0.1"

# Tối ưu hoá file exe siêu nhỏ và tốc độ cao
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.packager]
product-name = "Vidi File Management"
identifier = "com.vidi.filemanagement"
publisher = "Vidi"
version = "0.1.0"
formats = ["nsis"]
out-dir = "dist"
icons = ["icons/icon.png"]

[[package.metadata.packager.binaries]]
path = "fast_media_browser_rs.exe"
main = true

[package.metadata.packager.nsis]
installMode = "currentUser"
